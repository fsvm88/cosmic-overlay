name: QA Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly runs on Sundays at 06:00 UTC
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  qa-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gentoo in Docker
        run: |
          # Create a custom Dockerfile for our QA environment
          cat > Dockerfile << 'EOF'
          FROM fsvm88/gentoo-docker-pkgdev-pkgcheck:latest

          # Get gentoo tree
          RUN emerge-webrsync

          # Ensure repository directories exist
          RUN mkdir -p /var/db/repos/cosmic-overlay

          # Gentoo main repo is preconfigured in the image; no manual configuration needed
          # Configure overlay
          RUN echo '[cosmic-overlay]' > /etc/portage/repos.conf/cosmic-overlay.conf
          RUN echo 'location = /var/db/repos/cosmic-overlay' >> /etc/portage/repos.conf/cosmic-overlay.conf
          RUN echo 'sync-type = git' >> /etc/portage/repos.conf/cosmic-overlay.conf
          RUN echo 'masters = gentoo' >> /etc/portage/repos.conf/cosmic-overlay.conf
          RUN echo 'auto-sync = no' >> /etc/portage/repos.conf/cosmic-overlay.conf

          WORKDIR /var/db/repos/cosmic-overlay
          EOF

          # Build the container
          docker build -t cosmic-qa .

      - name: Run QA checks in container
        run: |
          docker run --rm \
            -v "$PWD":/var/db/repos/cosmic-overlay \
            -w /var/db/repos/cosmic-overlay \
            cosmic-qa \
            bash -c '
              set -e
              python3 scripts/simple-qa-check.py --overlay-root . --reports-dir qa-reports
            '

      - name: Upload QA reports
        id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports-${{ github.sha }}
          path: qa-reports/
          retention-days: 30

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo "## QA report"
            echo "- Download the full report (open \`index.html\` in a browser): ${{ steps.upload.outputs.artifact-url }}"
            echo "- Latest main report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo
            [ -f qa-reports/report.md ] && cat qa-reports/report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with QA results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cosmic-overlay-qa -->';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            let summary = '_No report was generated; check the workflow logs._';
            if (fs.existsSync('qa-reports/report.md')) {
              summary = fs.readFileSync('qa-reports/report.md', 'utf8');
              if (summary.length > 50000) summary = summary.slice(0, 50000) + '\n\n_(truncated)_';
            }
            const body = `${marker}\n## 🔍 QA Check Results\n\n` +
              `📥 [Download full HTML report](${process.env.ARTIFACT_URL || runUrl}) (unzip, open \`index.html\`) · ` +
              `[Run logs and summary](${runUrl})\n\n` +
              `<details><summary>Summary</summary>\n\n${summary}\n\n</details>`;
            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              // Fork PRs get a read-only token; the job summary still has the report.
              console.log('Could not post PR comment:', error.message);
            }
